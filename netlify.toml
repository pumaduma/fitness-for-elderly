[build]
  command = "npm run build"
  publish = "dist"

# Clean-URL aliases: /programs serves programs.html, etc.
[[redirects]]
  from = "/programs"
  to = "/programs.html"
  status = 301

[[redirects]]
  from = "/schedule"
  to = "/schedule.html"
  status = 301

[[redirects]]
  from = "/centers"
  to = "/centers.html"
  status = 301

[[redirects]]
  from = "/membership"
  to = "/membership.html"
  status = 301

[[redirects]]
  from = "/volunteers"
  to = "/volunteers.html"
  status = 301

[[redirects]]
  from = "/donate"
  to = "/donate.html"
  status = 301

[[redirects]]
  from = "/health-tools"
  to = "/health-tools.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/news"
  to = "/news.html"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
