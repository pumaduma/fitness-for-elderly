<!DOCTYPE html>
<html lang="zh-Hant" data-fs="100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會員登記 — 樂齡健體 Fitness for the Elderly</title>
  <meta name="description" content="年滿60歲的香港居民可免費成為樂齡健體會員。四步網上登記，完成後即可報名任何課程並獲安排免費試堂。" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/pages.css" />
  <script>
    try {
      var p = JSON.parse(localStorage.getItem('ffe-a11y')) || {};
      if (p.fs) document.documentElement.setAttribute('data-fs', p.fs);
      if (p.contrast) document.documentElement.classList.add('high-contrast');
      if (p.motion) document.documentElement.classList.add('reduce-motion');
    } catch (e) {}
    try { if (localStorage.getItem('ffe-lang') === 'en') document.documentElement.lang = 'en'; } catch (e) {}
  </script>
</head>
<body data-page="membership">
  <main id="main-content">
    <section class="page-section" aria-labelledby="pg-title">
      <div class="container" style="max-width:52rem">
        <h1 id="pg-title" data-i18n="membership.title"></h1>
        <p class="lead" data-i18n="membership.subtitle"></p>

        <form id="membership-form" class="mt-2" novalidate>
          <!-- progress -->
          <div class="wizard-progress" id="wizard-progress" role="group" aria-label=""></div>
          <p class="sr-note" id="wizard-status" aria-live="polite"></p>

          <!-- STEP 1: eligibility -->
          <div class="wizard-panel" data-step="1">
            <h2 data-i18n="membership.eligibility.title"></h2>
            <p class="sr-note" data-i18n="membership.eligibility.ageHint"></p>
            <fieldset>
              <legend data-i18n="membership.eligibility.q1"></legend>
              <label class="check-row check-row--boxed"><input type="radio" name="age60" value="yes" required /><span data-i18n="membership.eligibility.yes"></span></label>
              <label class="check-row check-row--boxed"><input type="radio" name="age60" value="no" /><span data-i18n="membership.eligibility.no"></span></label>
            </fieldset>
            <fieldset>
              <legend data-i18n="membership.eligibility.q2"></legend>
              <label class="check-row check-row--boxed"><input type="radio" name="hkid" value="yes" required /><span data-i18n="membership.eligibility.yes"></span></label>
              <label class="check-row check-row--boxed"><input type="radio" name="hkid" value="no" /><span data-i18n="membership.eligibility.no"></span></label>
            </fieldset>
            <fieldset>
              <legend data-i18n="membership.eligibility.q3"></legend>
              <label class="check-row check-row--boxed"><input type="radio" name="medical" value="yes" required /><span data-i18n="membership.eligibility.yes"></span></label>
              <label class="check-row check-row--boxed"><input type="radio" name="medical" value="no" /><span data-i18n="membership.eligibility.no"></span></label>
            </fieldset>
            <div class="banner banner--info" id="elig-note" hidden role="status"></div>
          </div>

          <!-- STEP 2: personal -->
          <div class="wizard-panel" data-step="2" hidden>
            <h2 data-i18n="membership.personal.title"></h2>
            <div class="form-field">
              <label for="m-name" data-i18n="membership.personal.name"></label>
              <input id="m-name" name="name" type="text" autocomplete="name" data-i18n-attr="placeholder:membership.personal.namePh" aria-describedby="m-name-err" required />
              <p class="field-error" id="m-name-err" data-i18n="membership.personal.errName"></p>
            </div>
            <div class="form-field">
              <label for="m-name-en" data-i18n="membership.personal.nameEn"></label>
              <input id="m-name-en" name="nameEn" type="text" autocomplete="name" data-i18n-attr="placeholder:membership.personal.nameEnPh" />
            </div>
            <div class="form-field">
              <label for="m-dob" data-i18n="membership.personal.dob"></label>
              <input id="m-dob" name="dob" type="date" aria-describedby="m-dob-err" required />
              <p class="field-error" id="m-dob-err" data-i18n="membership.personal.errDob"></p>
              <p class="field-error" id="m-dob-future" data-i18n="membership.personal.errDobFuture"></p>
            </div>
            <div class="form-field">
              <label for="m-phone" data-i18n="membership.personal.phone"></label>
              <input id="m-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" data-i18n-attr="placeholder:membership.personal.phonePh" aria-describedby="m-phone-err" required />
              <p class="field-error" id="m-phone-err" data-i18n="membership.personal.errPhone"></p>
            </div>
            <div class="form-field">
              <label for="m-district" data-i18n="membership.personal.address"></label>
              <select id="m-district" name="district" required><option value=""></option></select>
              <p class="hint" data-i18n="membership.personal.addressHint"></p>
            </div>
            <div class="form-field">
              <label for="m-emergency" data-i18n="membership.personal.emergency"></label>
              <input id="m-emergency" name="emergency" type="text" data-i18n-attr="placeholder:membership.personal.emergencyPh" />
            </div>
            <label class="check-row">
              <input type="checkbox" name="consent" required />
              <span data-i18n="membership.personal.consent"></span>
            </label>
            <p class="field-error is-visible" id="m-consent-err" data-i18n="membership.personal.consentRequired" style="margin-top:0.25rem"></p>
          </div>

          <!-- STEP 3: choose programs -->
          <div class="wizard-panel" data-step="3" hidden>
            <h2 data-i18n="membership.choose.title"></h2>
            <p data-i18n="membership.choose.subtitle"></p>
            <div class="card-grid mt-1" id="m-programs"></div>
          </div>

          <!-- STEP 4: review -->
          <div class="wizard-panel" data-step="4" hidden>
            <h2 data-i18n="membership.review.title"></h2>
            <p data-i18n="membership.review.check"></p>
            <dl class="card mt-1" id="m-review" style="display:grid;grid-template-columns:auto 1fr;gap:0.3rem 1.25rem"></dl>
          </div>

          <!-- success -->
          <div class="wizard-panel" data-step="5" hidden>
            <div class="banner banner--success">
              <h2 data-i18n="membership.success.title"></h2>
            </div>
            <p id="m-success-body"></p>
            <h3 class="mt-2" data-i18n="membership.success.whatsNext"></h3>
            <div class="btn-group mt-1">
              <a class="btn btn--primary" href="/schedule.html" data-i18n="membership.success.next1"></a>
              <a class="btn btn--secondary" href="/health-tools.html" data-i18n="membership.success.next2"></a>
              <a class="btn btn--ghost" href="/centers.html" data-i18n="membership.success.next3"></a>
            </div>
          </div>

          <div class="wizard-nav">
            <button type="button" class="btn btn--ghost" id="wiz-prev" data-i18n="common.prev" hidden></button>
            <button type="button" class="btn btn--primary" id="wiz-next" data-i18n="common.next"></button>
            <button type="submit" class="btn btn--primary" id="wiz-submit" data-i18n="membership.submit" hidden></button>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/membership.js"></script>
</body>
</html>
