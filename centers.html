<!DOCTYPE html>
<html lang="zh-Hant" data-fs="100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中心網絡 — 樂齡健體 Fitness for the Elderly</title>
  <meta name="description" content="樂齡健體計劃在六個地區設立服務點：深水埗、觀塘、沙田、屯門、中環、將軍澳。選址以鄰近港鐵站及無障礙通道為先，場地仍在洽談中。Planned Fitness for the Elderly service points in six Hong Kong districts." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/pages.css" />
  <script>
    try {
      var p = JSON.parse(localStorage.getItem('ffe-a11y')) || {};
      if (p.fs) document.documentElement.setAttribute('data-fs', p.fs);
      if (p.contrast) document.documentElement.classList.add('high-contrast');
      if (p.motion) document.documentElement.classList.add('reduce-motion');
    } catch (e) {}
    try { if (localStorage.getItem('ffe-lang') === 'en') document.documentElement.lang = 'en'; } catch (e) {}
  </script>
</head>
<body data-page="centers">
  <main id="main-content">
    <section class="page-section" aria-labelledby="pg-title">
      <div class="container">
        <h1 id="pg-title" data-i18n="centers.title"></h1>
        <p class="lead" data-i18n="centers.subtitle"></p>

        <div class="map-layout mt-2">
          <div>
            <div id="centers-map" role="application" tabindex="0" aria-label=""></div>
            <p class="sr-note mt-1" data-i18n="centers.mapLabel"></p>
          </div>
          <div class="center-list" id="center-list"></div>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/map.js"></script>
</body>
</html>
